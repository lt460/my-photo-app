<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авто-фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            color: white;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #aaa;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            max-width: 640px;
            border-radius: 12px;
            border: 3px solid #0f3460;
            transform: scaleX(-1);
            background: #000;
        }
        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success {
            background: #2ecc71;
            color: white;
        }
        .error {
            background: #e74c3c;
            color: white;
        }
        .info {
            background: #3498db;
            color: white;
        }
        .warning {
            background: #f39c12;
            color: white;
        }
        #preview {
            margin-top: 20px;
            max-width: 100%;
            border-radius: 12px;
            display: none;
            border: 3px solid #2ecc71;
        }
        .photo-info {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
        .btn-retry {
            margin-top: 15px;
            padding: 12px 30px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            display: none;
        }
        .btn-retry:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Авто-фото</h1>
        <p class="subtitle">Камера включится и сделает снимок автоматически</p>
        
        <video id="video" autoplay playsinline></video>
        
        <div id="status">⏳ Загрузка...</div>
        <img id="preview" alt="Снимок" />
        <div id="photoInfo" class="photo-info"></div>
        <button class="btn-retry" id="retryBtn">🔄 Сделать ещё фото</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
