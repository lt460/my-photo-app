<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фото собеседника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            color: white;
            padding: 10px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 20px 16px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #8888aa;
            font-size: 14px;
            margin-bottom: 16px;
            font-weight: 300;
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 4/3;
            border: 2px solid #0f3460;
            touch-action: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }
        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a1a;
            color: #666;
            font-size: 14px;
            gap: 10px;
        }
        .video-placeholder .icon {
            font-size: 48px;
            opacity: 0.5;
        }
        .video-placeholder.hidden {
            display: none;
        }
        #status {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: 500;
            gap: 10px;
            word-break: break-word;
            line-height: 1.4;
        }
        .status-success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
        .status-error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }
        .status-info { background: rgba(52, 152, 219, 0.2); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.3); }
        .status-warning { background: rgba(243, 156, 18, 0.2); color: #f39c12; border: 1px solid rgba(243, 156, 18, 0.3); }
        
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        .spinner-white { border-top-color: #fff; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #preview {
            margin-top: 16px;
            width: 100%;
            border-radius: 12px;
            display: none;
            border: 2px solid rgba(46, 204, 113, 0.4);
            aspect-ratio: 4/3;
            object-fit: cover;
            background: #000;
        }
        .photo-info {
            margin-top: 8px;
            font-size: 11px;
            color: #666;
            word-break: break-all;
            padding: 0 4px;
        }
        .photo-info.success { color: #2ecc71; }
        
        @media (max-width: 480px) {
            .container { padding: 14px 12px 18px; border-radius: 18px; }
            h1 { font-size: 20px; }
            .subtitle { font-size: 12px; margin-bottom: 12px; }
            #status { font-size: 12px; padding: 10px 12px; min-height: 42px; }
            .photo-info { font-size: 10px; }
        }
        @media (max-width: 380px) {
            .container { padding: 10px 8px 14px; }
            h1 { font-size: 18px; }
        }
        @media (min-width: 768px) {
            .container { padding: 30px 25px 35px; }
            h1 { font-size: 30px; }
            .subtitle { font-size: 16px; }
        }
        * { -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Фото</h1>
        <p class="subtitle">Камера включится автоматически</p>
        
        <div class="video-wrapper">
            <video id="video" autoplay playsinline muted webkit-playsinline></video>
            <div class="video-placeholder" id="placeholder">
                <span class="icon">📷</span>
                <span>Ожидание камеры...</span>
            </div>
        </div>
        
        <div id="status">
            <span class="spinner spinner-white"></span>
            <span>Подключение к камере...</span>
        </div>
        
        <img id="preview" alt="Снимок" />
        <div id="photoInfo" class="photo-info"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
