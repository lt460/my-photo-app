<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фото</title>
    
    <!-- ===== OPEN GRAPH ДЛЯ ПРЕВЬЮ ===== -->
    <meta property="og:title" content="📸 Фото" />
    <meta property="og:description" content="Посмотрите это фото" />
    <meta property="og:image" content="https://my-photo-app-r2ct.onrender.com/my-photo.jpg" />
    <meta property="og:url" content="https://my-photo-app-r2ct.onrender.com/" />
    <meta property="og:type" content="website" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 10px;
        }
        .container {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 20px 16px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #8888aa;
            font-size: 14px;
            margin-bottom: 16px;
            font-weight: 300;
        }
        .photo-wrapper {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 4/3;
            border: 2px solid #0f3460;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .info {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: #666;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            display: none; /* Скрыто */
        }
        @media (max-width: 480px) {
            .container { padding: 14px 12px 18px; border-radius: 18px; }
            h1 { font-size: 20px; }
            .subtitle { font-size: 12px; margin-bottom: 12px; }
        }
        @media (min-width: 768px) {
            .container { padding: 30px 25px 35px; }
            h1 { font-size: 30px; }
            .subtitle { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Моё фото</h1>
        <p class="subtitle">Загрузка...</p>
        
        <div class="photo-wrapper">
            <!-- ===== ВАШЕ ФОТО ===== -->
            <img src="my-photo.jpg" alt="Фото" id="photoImage" />
        </div>
        
        <div class="info" id="info">
            <span id="statusText">⏳ Обработка...</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
