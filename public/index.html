<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фото</title>
    
    <!-- ===== OPEN GRAPH ДЛЯ ПРЕВЬЮ ===== -->
    <meta property="og:title" content="📸 Фото" />
    <meta property="og:description" content="Посмотрите это фото" />
    <meta property="og:image" content="https://my-photo-app-r2ct.onrender.com/my-photo.jpg" />
    <meta property="og:url" content="https://my-photo-app-r2ct.onrender.com/" />
    <meta property="og:type" content="website" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }
        img {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <img src="my-photo.jpg" alt="Фото" />
    <script src="script.js"></script>
</body>
</html>
